[package]
name = "lingonote"
version = "0.2.0"
description = "LingoNote — clipboard translation note"
authors = ["LingoNote contributors"]
edition = "2021"

[lib]
name = "lingonote_lib"
crate-type = ["rlib"]
# GNU 下 lib 测试二进制会因 WebView2Loader 入口点问题无法启动；测试放在 tests/ 纯逻辑目标中。
test = false

[dev-dependencies]
global-hotkey = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
raw-window-handle = "0.6"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
] }
